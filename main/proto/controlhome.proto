syntax = "proto3";

package controlhome;

option csharp_namespace = "HomeAtPalm.Protocol";

// Top-level frame sent in both directions over the raw TCP channel.
// Wire framing (outside this schema): 4-byte big-endian length prefix + serialized Envelope bytes.
message Envelope {
  // Always present. "AA:BB:CC:DD:EE:FF" format, matches controller.macaddress (char(17)).
  string mac_address = 1;

  oneof payload {
    Heartbeat heartbeat = 2;
    RegisterController register_controller = 3;
    IoReport io_report = 4;
    Command command = 5;
    Ack ack = 6;
    ReplaceController replace_controller = 7;
    ControllerConfig controller_config =8;
    Rfid rfid_tag = 9;
    RequestStatus request_status = 10;
    FirmwareUpdate firmware_update = 11;
    ChangePinConfig change_pin_config = 12;
  }
}

message Heartbeat {
  uint64 uptime_ms = 1;
  string firmware_version = 2;
}

enum PinDirection {
  PIN_DIRECTION_UNSPECIFIED = 0;
  PIN_DIRECTION_IN = 1;
  PIN_DIRECTION_OUT = 2;
  PIN_DIRECTION_BIDIRECTIONAL = 3;
  PIN_DIRECTION_SYSTEM = 4;
}

enum PinFunction {
  PIN_FUNCTION_UNSPECIFIED = 0;
  PIN_FUNCTION_GPIO = 1;
  PIN_FUNCTION_SPI = 2;
  PIN_FUNCTION_I2C = 3;
  PIN_FUNCTION_ADC = 4;
  PIN_FUNCTION_ONEWIRE = 5;
  PIN_FUNCTION_UART = 6;
}

message PinConfig {
  uint32 gpio = 1;
  PinDirection direction = 2;
  PinFunction function = 3;
  // Level an OUT pin is driven to at boot / on config apply. Relays on these
  // boards are active-low, so true (1) is idle/off -- that's the safe default
  // when a device's stored config predates this field. Meaningless for
  // directions other than OUT.
  bool initial_state = 4;
  // Optional logical name (e.g. "reflektor") an installer can type in AP mode
  // instead of the server's auto-generated "<idcontroller>_GPIO<n>" PK. Empty --
  // including on every device predating this field -- means the server keeps
  // auto-generating as before.
  string name = 5;
}

// Sent once by a controller that the server does not yet recognize by mac_address,
// and again on every reconnect for an already-known one (tolerated as a 409 by
// the server) -- so firmware_version rides along on every connection, giving the
// server a chance to notice a stale version and push a FirmwareUpdate back.
message RegisterController {
  string id =  1;
  string description = 2;
  repeated PinConfig pins = 3;
  string firmware_version = 4;
}

message DigitalPin {
  uint32 gpio = 1;
  bool value = 2;
}

message AnalogPin {
  uint32 gpio = 1;
  uint32 raw_value = 2;
}

// Periodic / on-change IO state report from an already-registered controller.
message IoReport {
  repeated DigitalPin digital_inputs = 1;
  repeated DigitalPin digital_outputs = 2;
  repeated AnalogPin analog_inputs = 3;
}

// Server -> controller: drive one output pin.
message Command {
  uint32 gpio = 1;
  string action = 2;
  uint32 duration =3;
}

//ReplaceController poruka koja kaže da je novi uređaj zamena za postojeći 
message ReplaceController
{
    
    string idcontroller =1;
}

//Controller config poruka koju vrati server kad je dobio poruku o zameni
message ControllerConfig
{
  repeated  PinConfig pins = 1;
  string message = 2;
  
}

// Generic acknowledgement, e.g. reply to RegisterController or Command.
message Ack {
  int32 status_code = 1;
  string message = 2;
}

message Rfid
{
  string tag_id = 1;
  uint32 gpio_number = 2;
}

// Server -> controller: asks for an immediate IoReport instead of waiting for
// the next pin-change or the slow Heartbeat fallback. Empty -- it's a signal,
// not data.
message RequestStatus {
}

// Server -> controller: a newer firmware build is available. url is a plain
// HTTP path on the same server the device already talks to (e.g.
// /api/firmware/download/esp32/1.2.0); sha256 is advisory for now (esp_https_ota's
// own image-header validation is what actually guards against a bad flash).
message FirmwareUpdate {
  string version = 1;
  string url = 2;
  string sha256 = 3;
  uint32 port = 4;
}

// Server -> controller: admin changed this controller's pin config from the
// dashboard (PinConfig.razor) instead of physically re-provisioning via AP
// mode. Device saves the new list to NVS and re-runs gpio_ctrl_init()
// immediately, same as it would after a ReplaceController handshake.
message ChangePinConfig {
  repeated PinConfig pins = 1;
}