<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>HomeControl node</title>
</head>
<body>
    <h1>HomeControl node</h1>
    <form id="configForm" action="/save" method="POST">
        <label for="ssid">WiFi SSID:</label><br>
        <input type="text" id="ssid" name="ssid"><br><br>
        <label for="password">WiFi lozinka:</label><br>
        <input type="password" id="password" name="password"><br><br>
        <label for="server_ip">IP adresa servera:</label><br>
        <input type="text" id="server_ip" name="server_ip" value="192.168.0.32"><br><br>

        <label><input type="radio" name="mode" value="new" checked onclick="toggleMode()"> Nov kontroler</label>
        <label><input type="radio" name="mode" value="replace" onclick="toggleMode()"> Zamena postojeceg</label>
        <br><br>

        <div id="newSection">
            
            <label for="ctrl_id">ID kontrolera:</label><br>
            <input type="text" id="ctrl_id" name="ctrl_id"><br><br>
            <label for="ctrl_description">Opis:</label><br>
            <input type="text" id="ctrl_description" name="ctrl_description"><br><br>
            <h3>Konfiguracija pinova</h3>
            <table>
                <thead>
                    <tr><th>Pin</th><th>Funkcija</th><th>Pocetno stanje</th><th>Naziv (opciono)</th></tr>
                </thead>
                <tbody id="pinsContainer"></tbody>
            </table>
        </div>

        <div id="replaceSection" style="display:none;">
            <label for="replace_id">ID kontrolera koji se zamenjuje:</label><br>
            <input type="text" id="replace_id" name="replace_id"><br><br>
        </div>

        <input type="hidden" id="pins" name="pins" value="">
        <br><br>
        <button type="submit">OK</button>
        <button type="reset">Cancel</button>
    </form>

<script>
function toggleMode() {
    var mode = document.querySelector('input[name="mode"]:checked').value;
    document.getElementById('newSection').style.display = (mode === 'new') ? 'block' : 'none';
    document.getElementById('replaceSection').style.display = (mode === 'replace') ? 'block' : 'none';
}

function loadPins() 
{
    fetch('/pins.json')
        .then(function(response) { return response.json(); })
       .then(function(data) 
       {
        var container = document.getElementById('pinsContainer');
        data.pins.forEach(function(pin) {
        var row = document.createElement('tr');

        var pinCell = document.createElement('td');
        pinCell.textContent = 'Pin ' + pin.pin;
        row.appendChild(pinCell);

        var selectCell = document.createElement('td');
        var select = document.createElement('select');
        select.setAttribute('data-pin', pin.pin);

        var noneOption = document.createElement('option');
        noneOption.value = '';
        noneOption.textContent = '(nekorisceno)';
        select.appendChild(noneOption);

        pin.functions.forEach(function(fn) 
        {
            var opt = document.createElement('option');
            opt.value = fn;
            opt.textContent = fn;
            select.appendChild(opt);
        });

        selectCell.appendChild(select);
        row.appendChild(selectCell);

        var initialCell = document.createElement('td');
        var initialSelect = document.createElement('select');
        initialSelect.setAttribute('data-initial-for', pin.pin);
        initialSelect.style.display = 'none';

        var offOption = document.createElement('option');
        offOption.value = '1';
        offOption.textContent = 'Van pogona (1)';
        initialSelect.appendChild(offOption);

        var onOption = document.createElement('option');
        onOption.value = '0';
        onOption.textContent = 'U pogonu (0)';
        initialSelect.appendChild(onOption);

        initialCell.appendChild(initialSelect);
        row.appendChild(initialCell);

        var nameCell = document.createElement('td');
        var nameInput = document.createElement('input');
        nameInput.setAttribute('type', 'text');
        nameInput.setAttribute('data-name-for', pin.pin);
        nameInput.setAttribute('placeholder', 'npr. reflektor');
        nameInput.style.display = 'none';
        nameCell.appendChild(nameInput);
        row.appendChild(nameCell);

        select.addEventListener('change', function() {
            var used = select.value !== '';
            initialSelect.style.display = (select.value === 'GPIO_OUT') ? 'inline' : 'none';
            nameInput.style.display = used ? 'inline' : 'none';
        });

        container.appendChild(row);
    });
});
}

document.getElementById('configForm').addEventListener('submit', function(ev) {
    var mode = document.querySelector('input[name="mode"]:checked').value;
    var ssid = document.getElementById('ssid').value.trim();

    if (ssid === '') {
        ev.preventDefault();
        alert('WiFi SSID je obavezan.');
        return;
    }

    var serverIp = document.getElementById('server_ip').value.trim();
    if (serverIp === '') {
        ev.preventDefault();
        alert('IP adresa servera je obavezna.');
        return;
    }

    if (mode === 'new') {
        var ctrlId = document.getElementById('ctrl_id').value.trim();
        if (ctrlId === '') {
            ev.preventDefault();
            alert('Ime kontrolera je obavezno.');
            return;
        }

        var rows = document.querySelectorAll('#pinsContainer tr');
        var parts = [];
        var nameError = null;
        rows.forEach(function(row) {
            var sel = row.querySelector('select[data-pin]');
            if (sel.value !== '') {
                var nameInput = row.querySelector('input[data-name-for]');
                var name = nameInput.value.trim();
                if (name !== '' && !/^[A-Za-z0-9_]+$/.test(name)) {
                    nameError = 'Naziv pina "' + name + '" sme da sadrži samo slova, brojeve i donju crtu (bez razmaka, dvotačke, zareza).';
                }

                var part = sel.getAttribute('data-pin') + ':' + sel.value;
                // The initial_state digit is positionally required before a name --
                // emit it even for a non-OUT pin (where it's otherwise meaningless and
                // ignored) whenever a name is present, so parsing stays unambiguous.
                if (sel.value === 'GPIO_OUT') {
                    var initialSelect = row.querySelector('select[data-initial-for]');
                    part += ':' + initialSelect.value;
                } else if (name !== '') {
                    part += ':1';
                }
                if (name !== '') {
                    part += ':' + name;
                }
                parts.push(part);
            }
        });
        if (nameError) {
            ev.preventDefault();
            alert(nameError);
            return;
        }
        document.getElementById('pins').value = parts.join(',');
    } else if (mode === 'replace') {
        var replaceId = document.getElementById('replace_id').value.trim();
        if (replaceId === '') {
            ev.preventDefault();
            alert('ID kontrolera koji se zamenjuje je obavezan.');
            return;
        }
    }
});

loadPins();
</script>
</body>
</html>
